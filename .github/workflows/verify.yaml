name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest commit for a ref needs verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: generated-assets
            run: pnpm --filter @floway-dev/agent-setup run generate-assets --check
          # `build.yaml` does not run on pull requests.
          # The Vite build owns its output assertions, so every build path
          # validates the emitted browser graph.
          - name: build
            run: pnpm run build:web
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  # Type checking resolves each package's dependencies from their `src` through
  # the workspace export maps — no tsconfig `references`, no build step — so a
  # package's `tsc --noEmit` stands alone and the `pnpm -r` topology order is a
  # convention rather than a correctness requirement. That is what makes the
  # split safe: any subset type-checks on its own.
  #
  # Two jobs, not four. `apps/web` is the heaviest single project (20 s alone
  # against 42 s for everything else), so it gets its own job and the other 19
  # packages share the second. Splitting further was measured at four groups on
  # one machine and came to 60 s against 68 s serial, because tsc is single
  # threaded and the groups only competed; on separate runners the extra jobs buy
  # little beyond this split.
  #
  # The cost is duplicated work: `apps/web` and `packages/gateway` re-resolve the
  # same sources the package job already checked. Total CPU goes up slightly while
  # wall-clock goes down, which is the trade this workflow is making.
  #
  # The root `scripts` config has its own tsconfig and rides with the package job.
  typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck (web)
            run: pnpm --filter @floway-dev/web run typecheck
          - name: typecheck (packages)
            run: pnpm --filter '!@floway-dev/web' -r run typecheck && pnpm exec tsc --noEmit -p tsconfig.scripts.json
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # `apps/web`'s own typecheck script runs `react-router typegen` first; no
      # other package reads the generated route types.
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Lint is type-aware: every file is parsed against its TypeScript project, so
  # its cost scales with the file count and one runner spent 124 s on it. It runs
  # as three jobs split by measured cost rather than file count: `apps` alone took
  # 92 s of that run, and `packages/gateway` is the largest type-checked tree
  # after it, so each gets its own job and the remaining packages share the third.
  # The target sets are complementary by construction, so no file is linted twice,
  # and the root config files sit in the last set to keep them covered.
  #
  # The split exists because a two-way split left `packages` — gateway included —
  # on the critical path at 130 s against 47 s for `apps`.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint (apps)
            targets: apps
          - name: lint (gateway)
            targets: packages/gateway
          - name: lint (other packages)
            targets: eslint.config.ts vitest.config.ts packages/agent-setup packages/dump packages/http packages/interceptor packages/pipeline packages/platform packages/protocols packages/provider packages/provider-azure packages/provider-claude-code packages/provider-chatgpt packages/provider-copilot packages/provider-custom packages/provider-ollama packages/proxy packages/test-utils packages/translate scripts tools
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate route types
        run: pnpm run typegen
      - name: ${{ matrix.name }}
        run: pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=12288" eslint --cache ${{ matrix.targets }}

  # The suite splits into two shapes that cannot share one runner budget: the
  # installer integration project runs one file at a time (each case spawns a
  # real shell, and `fileParallelism` is off for it), and it is worth about a
  # third of the whole run on its own. Both halves then spread over `--shard`,
  # so one job no longer carries every file of either kind.
  #
  # These jobs run on separate runners, which is the parallelism a single
  # machine cannot have: two workers on one host lose Microsoft PowerShell
  # cases to CPU contention, while two runners do not.
  #
  # The installer project has one shard per heavy file. Its files take 53/43/40/
  # 36/35/6 s on a runner plus the trap at 0 s, and any shard count below six
  # leaves at least one job carrying two of the heavy ones: at two shards the
  # slowest job is 129 s, at three 96 s, and at six the slowest is codex at
  # 43 s. The extra runners cost a minute of setup each and nothing else.
  #
  # Six is the useful ceiling rather than seven: the seventh shard would hold
  # only the trap, which finishes in milliseconds. Adding a real test file to
  # the project needs this count revisited; Vitest refuses a shard count above
  # the resolved file count rather than passing with an empty job, so a mismatch
  # fails the workflow instead of silently skipping a file.
  test-installers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: test-installers (${{ matrix.shard }}/6)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install latest Codex for installer compatibility
        run: npm install --prefix data/codex-ci --no-save --package-lock=false @openai/codex@latest
      - name: test-installers (${{ matrix.shard }}/6)
        run: CODEX_TEST_BIN="$GITHUB_WORKSPACE/data/codex-ci/node_modules/.bin/codex" pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=8192" vitest run --project agent-setup-installers --shard=${{ matrix.shard }}/6

  # Eight shards for the 771 non-installer files, about 96 files each. At five the
  # slowest shard sat at 124 s of test time; at eight the slowest carries about
  # 100 s, and on top of the ~30 s runner setup that still finishes inside
  # `typecheck`'s 138 s, which sets the floor for the workflow. Ten shards were
  # measured too: they bought about 11 s of the slowest shard, which the floor
  # swallows, so the two extra runners were doing nothing.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (${{ matrix.shard }}/8)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install latest Codex for installer compatibility
        run: npm install --prefix data/codex-ci --no-save --package-lock=false @openai/codex@latest
      - name: test (${{ matrix.shard }}/8)
        run: CODEX_TEST_BIN="$GITHUB_WORKSPACE/data/codex-ci/node_modules/.bin/codex" pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=8192" vitest run --project '!agent-setup-installers' --shard=${{ matrix.shard }}/8
