name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest commit for a ref needs verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: typecheck
            run: pnpm -r run typecheck && pnpm exec tsc --noEmit -p tsconfig.scripts.json
          - name: generated-assets
            run: pnpm --filter @floway-dev/agent-setup run generate-assets --check
          # `build.yaml` does not run on pull requests.
          # The Vite build owns its output assertions, so every build path
          # validates the emitted browser graph.
          - name: build
            run: pnpm run build:web
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate route types
        if: matrix.check.name == 'typecheck'
        run: pnpm run typegen
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  # Lint is type-aware: every file is parsed against its TypeScript project, so
  # its cost scales with the file count and one runner spent 124 s on it. It runs
  # as two jobs split by measured cost rather than file count: `apps` alone took
  # 92 s of the 124 s, so it gets its own job and every package shares the other.
  # The two target sets are complementary by construction, so no file is linted
  # twice, and the root config files sit in the second set to keep them covered.
  #
  # Two rather than three because the third only shortened a job that is no
  # longer on the critical path: `typecheck` sets the floor at 138 s and either
  # set here finishes well inside it.
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint (apps)
            targets: apps
          - name: lint (packages)
            targets: eslint.config.ts vitest.config.ts packages scripts tools
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate route types
        run: pnpm run typegen
      - name: ${{ matrix.name }}
        run: pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=12288" eslint --cache ${{ matrix.targets }}

  # The suite splits into two shapes that cannot share one runner budget: the
  # installer integration project runs one file at a time (each case spawns a
  # real shell, and `fileParallelism` is off for it), and it is worth about a
  # third of the whole run on its own. Both halves then spread over `--shard`,
  # so one job no longer carries every file of either kind.
  #
  # These jobs run on separate runners, which is the parallelism a single
  # machine cannot have: two workers on one host lose Microsoft PowerShell
  # cases to CPU contention, while two runners do not.
  #
  # The installer project has one shard per heavy file. Its files take 53/43/40/
  # 36/35/6 s on a runner plus the trap at 0 s, and any shard count below six
  # leaves at least one job carrying two of the heavy ones: at two shards the
  # slowest job is 129 s, at three 96 s, and at six the slowest is codex at
  # 43 s. The extra runners cost a minute of setup each and nothing else.
  #
  # Six is the useful ceiling rather than seven: the seventh shard would hold
  # only the trap, which finishes in milliseconds. Adding a real test file to
  # the project needs this count revisited; Vitest refuses a shard count above
  # the resolved file count rather than passing with an empty job, so a mismatch
  # fails the workflow instead of silently skipping a file.
  test-installers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: test-installers (${{ matrix.shard }}/6)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install latest Codex for installer compatibility
        run: npm install --prefix data/codex-ci --no-save --package-lock=false @openai/codex@latest
      - name: test-installers (${{ matrix.shard }}/6)
        run: CODEX_TEST_BIN="$GITHUB_WORKSPACE/data/codex-ci/node_modules/.bin/codex" pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=8192" vitest run --project agent-setup-installers --shard=${{ matrix.shard }}/6

  # Eight shards for the 771 non-installer files, about 96 files each. At five the
  # slowest shard sat at 124 s of test time; at eight the slowest carries about
  # 100 s, and on top of the ~30 s runner setup that still finishes inside
  # `typecheck`'s 138 s, which sets the floor for the workflow. Ten shards were
  # measured too: they bought about 11 s of the slowest shard, which the floor
  # swallows, so the two extra runners were doing nothing.
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: test (${{ matrix.shard }}/8)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install latest Codex for installer compatibility
        run: npm install --prefix data/codex-ci --no-save --package-lock=false @openai/codex@latest
      - name: test (${{ matrix.shard }}/8)
        run: CODEX_TEST_BIN="$GITHUB_WORKSPACE/data/codex-ci/node_modules/.bin/codex" pnpm exec cross-env NODE_OPTIONS="--max-old-space-size=8192" vitest run --project '!agent-setup-installers' --shard=${{ matrix.shard }}/8
