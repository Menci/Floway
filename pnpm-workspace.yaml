packages:
  - packages/*
  - apps/*
  - tools

# pnpm blocks lifecycle scripts by default. These four ship prebuilt binaries
# or native bindings and need theirs to run: esbuild and sharp for the Node
# deployment target, unrs-resolver for the ESLint TypeScript resolver, workerd
# for Wrangler.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

# The @fluentui/react-charts patch carries six fixes, all in code the package
# ships prebuilt, so none of them can be reached from a prop:
#
#   - CartesianChart measures its parent in an effect and publishes the result
#     as state. Under `useEffect` that lands after paint, so a reload shows one
#     frame of a zero-width chart; `useLayoutEffect` puts it before. The `width`
#     prop is only a change-detector, not a dimension, so an app-side
#     ResizeObserver cannot close the gap.
#   - AreaChart sizes its transparent hover target from that same measurement,
#     and `containerHeight - margins.top` is negative until it arrives. A
#     negative `width`/`height` on an SVG `rect` is an error, so the values are
#     clamped at zero.
#   - That same rect answers a pointer that is not over a series, and its width
#     was the x of the last *nice tick* rather than the axis end — the two agree
#     only when the window happens to end on a tick. Everything past that tick
#     fell outside the hover target, so the right of the plot (and, above or
#     below the plotted band, the whole of it) went dead to the pointer while
#     the chart's own vertical line and callout never appeared. The width now
#     comes from the scale's range, which is the plot's own right edge.
#   - LineChart pushes two elements into `pointsForLine` without a key.
#   - LineChart anchors its hover callout on the highlighted data point and only
#     re-anchors when that point changes, so the callout jumps between points and
#     then stands still while the pointer keeps travelling inside one point's
#     span. Its AreaChart sibling anchors on the pointer instead. The callout now
#     follows the pointer on hover and keeps the data point as the anchor for a
#     keyboard focus, which has no pointer to follow.
#   - The date axis rounds its domain outward twice — unconditionally through
#     d3's `nice()`, and again by 10% per side in markers mode — so the first
#     and last of the `tickValues` we pass land inside the plot instead of at
#     its ends, and the series stops short of both edges. That is the defect
#     reported upstream as microsoft/fluentui#35533 ("chart do not occupy the
#     entire width of the canvas"), closed pointing at `xMinValue`/`xMaxValue`,
#     which the date axis never reads — they exist only on the numeric sibling.
#     There is no supported way to ask for the domain we want
#     (microsoft/fluentui#32474: "We don't provide support to customize the
#     domain currently"), so both roundings are gated on the caller not having
#     supplied ticks.
#
# https://github.com/microsoft/fluentui/blob/4aa1084999a8c1ac7245724ad6c76210fe80acf6/packages/charts/react-charts/library/src/components/AreaChart/AreaChart.tsx#L1127-L1130
# https://github.com/microsoft/fluentui/blob/4aa1084999a8c1ac7245724ad6c76210fe80acf6/packages/charts/react-charts/library/src/utilities/utilities.ts#L463-L468
# https://github.com/microsoft/fluentui/blob/4aa1084999a8c1ac7245724ad6c76210fe80acf6/packages/charts/react-charts/library/src/utilities/utilities.ts#L2232-L2265
# https://github.com/d3/d3/blob/ca958d45217b4c15332d971b935451a6d4c978f4/docs/d3-scale/time.md#L111-L124
# https://www.w3.org/TR/SVG2/shapes.html#RectElement
# Raw JSON integer tokens must survive cloning and streaming serialization.
# https://tc39.es/proposal-json-parse-with-source/#sec-json.rawjson
# Signed sidecars preserve lone-surrogate strings and keys with CBOR Tag 273.
# https://www.iana.org/assignments/cbor-tags/tags.csv
# https://github.com/svaarala/cbor-specs/blob/b85ac24ada38c1bdeb8e141be416d8d290dcd41b/cbor-nonutf8-string-tags.rst
# https://github.com/Menci/Floway/blob/54a8e2c783ed2ff1c166270c228821fa32aea252/patches/cbor-x%401.6.6.patch
# @fluentui/react-utilities infers a component's ref element from
# `Required<Props>['onLostPointerCaptureCapture']`. @types/react declares that
# handler as `?: PointerEventHandler<T> | undefined`, and under
# `exactOptionalPropertyTypes` `Required` keeps the explicit `undefined`, so the
# inference collapses to `never` and every `ref` on a Fluent component fails to
# type-check. Inferring from the handler with `undefined` removed restores the
# element type. The upstream report was closed by the stale bot unfixed.
# https://github.com/microsoft/fluentui/issues/25993
# https://github.com/microsoft/fluentui/blob/d0f2372099cfd0b50ba067977e1356c618ada747/packages/react-components/react-utilities/src/compose/types.ts#L237-L241
# The same patch lets an optional slot prop take `undefined`. `slot.optional`
# already treats `undefined` as an omitted slot, but `Slot` admits only `null`,
# and `null` hides a slot that would otherwise render by default.
# `ComponentState` strips `null` from the always-rendered `root` slot, and it
# now strips `undefined` beside it, so a resolved root stays required.
# https://github.com/microsoft/fluentui/blob/d0f2372099cfd0b50ba067977e1356c618ada747/packages/react-components/react-utilities/src/compose/slot.ts#L67-L75
# https://github.com/microsoft/fluentui/blob/d0f2372099cfd0b50ba067977e1356c618ada747/packages/react-components/react-utilities/src/compose/types.ts#L138-L157
# https://github.com/microsoft/fluentui/blob/d0f2372099cfd0b50ba067977e1356c618ada747/packages/react-components/react-utilities/src/compose/types.ts#L213-L218
# @hono/node-server stubs the `ws` server it accepts as `WebSocketServerLike`,
# declaring `options.noServer?: boolean` and the send option
# `compress?: boolean`, while @types/ws declares both with `| undefined`. Under
# `exactOptionalPropertyTypes` a real `WebSocketServer` is then not assignable
# to the stub, so the stub admits the explicit `undefined` its source types
# already carry.
# https://github.com/honojs/node-server/blob/3c196345fe048ee219a4ff05ea616488858fbdfb/src/websocket-types.ts#L16-L34
# https://github.com/DefinitelyTyped/DefinitelyTyped/blob/2bb69f9ac09fce7b6c84c835358fd6790e151005/types/ws/index.d.ts#L97
# https://github.com/DefinitelyTyped/DefinitelyTyped/blob/2bb69f9ac09fce7b6c84c835358fd6790e151005/types/ws/index.d.ts#L343
# hono's `JSONParsed` widens every optional property of a response to
# `T | undefined`, so under `exactOptionalPropertyTypes` an RPC response is
# no longer assignable to the type it was serialized from. The hono patch
# backports the upstream fix, which keeps an optional property optional and
# reserves `| undefined` for a required property whose value may be dropped.
# Droppable once hono reaches 4.13.20.
# https://github.com/honojs/hono/pull/5664
# https://github.com/honojs/hono/blob/01b43fbb1b61147f9965fa14f32e2c2326610166/src/utils/types.ts#L100-L106
# rolldown's `ExistingRawSourceMap` declares its optional fields without
# `| undefined`, while magic-string's `SourceMap` carries explicit
# `undefined`, so under `exactOptionalPropertyTypes` a plugin cannot return
# `generateMap()` as a transform's map. The rolldown patch backports the
# upstream fix, released in 1.2.19, which the vite release we use does not
# reach through its `~1.1.5` range.
# https://github.com/rolldown/rolldown/pull/10355
# https://github.com/rolldown/rolldown/blob/c9e81914c25b3d099ddddfd61b9057566e26f116/packages/rolldown/src/types/sourcemap.ts#L5-L14
patchedDependencies:
  'cbor-x@1.6.6': patches/cbor-x@1.6.6.patch
  '@discoveryjs/json-ext@1.1.0': patches/@discoveryjs__json-ext@1.1.0.patch
  'klona@2.0.6': patches/klona@2.0.6.patch
  '@fluentui/react-charts@9.3.22': patches/@fluentui__react-charts@9.3.22.patch
  '@fluentui/react-utilities@9.26.5': patches/@fluentui__react-utilities@9.26.5.patch
  '@hono/node-server@2.0.4': patches/@hono__node-server@2.0.4.patch
  '@reclaimprotocol/tls@0.1.5': patches/@reclaimprotocol__tls@0.1.5.patch
  'overlayscrollbars@2.13.0': patches/overlayscrollbars@2.13.0.patch
  'rolldown@1.1.5': patches/rolldown@1.1.5.patch
  'eventsource-parser@3.1.0': patches/eventsource-parser@3.1.0.patch
  'hono@4.12.22': patches/hono@4.12.22.patch

# eventsource-parser drops a line it cannot read as an SSE field. Some upstreams
# end a stream that already produced events with a bare JSON error body — no
# `data:` field, no framing — and dropping it turns a truncated answer into an
# apparent success. A line that opens an object literal is not a field name
# under the SSE grammar, so the parser reads it as event data; every other
# consumer of `parseSSEStream` only stops losing lines it previously dropped as
# unknown fields.
# Charts imports these runtime packages but omits them from its manifest.
# Keep resolution independent of whichever dependency happened to be hoisted.
# https://github.com/microsoft/fluentui/blob/cbee28ba42d268404e9b9663a6a3a33e205c66d1/packages/charts/react-charts/library/src/components/DeclarativeChart/DeclarativeChart.tsx#L17
# https://github.com/microsoft/fluentui/blob/cbee28ba42d268404e9b9663a6a3a33e205c66d1/packages/charts/react-charts/library/src/components/Legends/OverflowMenu.tsx#L5
# https://github.com/microsoft/fluentui/blob/cbee28ba42d268404e9b9663a6a3a33e205c66d1/packages/tokens/package.json
# https://github.com/microsoft/fluentui/blob/cbee28ba42d268404e9b9663a6a3a33e205c66d1/packages/react-components/react-menu/library/package.json
packageExtensions:
  '@fluentui/react-charts@9.3.22':
    dependencies:
      '@fluentui/tokens': 1.0.0-alpha.23
      '@fluentui/react-menu': 9.25.1

# @react-router/dev pulls in a standalone HTTP server we never run — the SPA is
# served by Workers Static Assets in production and by the Node target in the
# docker-compose topology.
overrides:
  # Require correct cancellation and error propagation through the Node/Web stream bridge.
  # https://developers.cloudflare.com/workers/runtime-apis/nodejs/streams/
  # Exercise D1's cursor expansion guard in local statistics regression tests.
  # https://github.com/sqlite/sqlite/blob/version-3.54.1/src/select.c#L5672-L5682
  'workerd@1.20260405.1': 1.20261108.1
  '@react-router/dev>@react-router/serve': '-'
  # monaco-editor 0.54.0 pins dompurify at exactly 3.1.7, which is behind every
  # advisory published since. 3.4.12 is the first release no advisory still
  # covers -- GHSA-c2j3-45gr-mqc4 names it as the fix, and nothing later has
  # been published against it. Droppable once Monaco's own pin reaches a
  # release in that position.
  # https://github.com/advisories/GHSA-c2j3-45gr-mqc4
  dompurify: 3.4.12
