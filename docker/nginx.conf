# The path set proxied to the gateway here MUST stay in sync with the same
# list in two other places — drift is silent and only surfaces as a 404 the
# SPA fallback served for a real gateway endpoint:
#
#   - `wranglerProxiedPaths` in apps/web/vite.config.ts (the `vite dev`
#     proxy-to-wrangler-dev topology).
#   - `assets.run_worker_first` in wrangler.example.jsonc (the production
#     Cloudflare Workers topology, where the SPA is served from Workers
#     Static Assets and the listed paths divert to the Worker).
#
# All three describe the same concept: every path the gateway owns; the
# rest is the SPA.

# This container is a plain HTTP reverse proxy (`listen 80` only). An operator
# who terminates TLS in their own proxy in front of it sends the real public
# scheme in X-Forwarded-Proto; we preserve that, but only as a bounded single
# `http`/`https` token — a comma-chained or otherwise unexpected value is never
# forwarded verbatim and falls back to our own `$scheme`. The gateway mirrors
# this exact validation in getRequestOrigin
# (packages/gateway/src/runtime/runtime-info.ts), so the origin it renders stays
# coherent whether traffic arrives here directly or through an outer terminator.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  "http"  "http";
  "https" "https";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 100m;

  # Shared by every proxied location below. `Upgrade`/`Connection` use the
  # request's own values so non-WS requests get empty strings (harmless) and
  # `GET /responses` / `GET /v1/responses` can upgrade to WebSocket.
  # `proxy_buffering off` is required for SSE streams and long LLM responses;
  # the gateway has no endpoint that benefits from response buffering.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_buffering off;
  proxy_read_timeout 1h;

  # Prefix paths. `/v1/*` covers chat/completions, responses, messages,
  # completions, embeddings, models, images/* under the OpenAI-style `/v1`
  # base URL.
  location ~ ^/(api|auth|v1|v1beta|azure-api\.codex)/ {
    proxy_pass http://server:8788;
  }

  # Bare paths — the gateway accepts every LLM endpoint with and without
  # the `/v1` prefix so SDKs configured with `baseURL = https://gw/` work.
  location ~ ^/(completions|chat/completions|responses(/compact)?|messages(/count_tokens)?|embeddings|models|images/(generations|edits))$ {
    proxy_pass http://server:8788;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
